<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Prolific Mock</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 1.5rem;
                line-height: 1.4;
            }
            fieldset {
                margin-bottom: 1rem;
            }
            input,
            select {
                margin: 2px;
            }
            li[data-testid^="study-"] {
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 8px 12px;
                margin: 6px 0;
                list-style: none;
            }
            .study-tags > * {
                display: inline-block;
                margin-right: 10px;
            }
            sup.indicator {
                color: #fff;
                background: #5b3df5;
                border-radius: 999px;
                padding: 0 6px;
            }
        </style>
    </head>
    <body>
        <fieldset>
            <legend>Add study</legend>
            <input id="f-title" value="Quick survey" placeholder="title" />
            <select id="f-symbol">
                <option>£</option>
                <option>$</option>
                <option>€</option>
            </select>
            <input id="f-reward" type="number" step="0.01" value="8.50" />
            <input id="f-rate" type="number" step="0.01" value="12.40" />
            <button id="add-study">Add</button>
            <button id="remove-study">Remove last</button>
            <button id="clear-studies">Clear</button>
        </fieldset>

        <fieldset>
            <legend>Add project</legend>
            <input id="p-name" value="My project" placeholder="name" />
            <input id="p-count" type="number" value="3" />
            <button id="add-project">Add</button>
            <button id="remove-project">Remove last</button>
        </fieldset>

        <nav class="projects-sidebar">
            <section>
                <h2>Projects</h2>
                <ul id="project-list"></ul>
            </section>
        </nav>

        <h2>Studies</h2>
        <ul id="study-list" style="padding: 0"></ul>

        <script type="module" src="/harness.js"></script>
    </body>
</html>
